name: Deploy website to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to S3 and refresh CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::929270557834:role/GitHubActionsMywebDeploy
          aws-region: ap-northeast-2
          role-session-name: github-myweb-deploy

      - name: Upload website files
        shell: bash
        run: |
          aws s3 cp index.html s3://ppujju/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp app.js s3://ppujju/app.js \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp content-index.js s3://ppujju/content-index.js \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp site-config.js s3://ppujju/site-config.js \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp styles.css s3://ppujju/styles.css \
            --content-type "text/css; charset=utf-8" \
            --cache-control "no-cache"

      - name: Synchronize images
        run: >-
          aws s3 sync static/image s3://ppujju/static/image
          --delete
          --cache-control "max-age=86400"

      - name: Synchronize Markdown content
        run: >-
          aws s3 sync templates s3://ppujju/templates
          --exclude "*"
          --include "*.md"
          --delete
          --content-type "text/markdown; charset=utf-8"
          --cache-control "no-cache"

      - name: Refresh and verify the live website
        shell: bash
        run: |
          INVALIDATION_ID="$(
            aws cloudfront create-invalidation \
              --distribution-id E1K76YCZI38NN9 \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text
          )"
          aws cloudfront wait invalidation-completed \
            --distribution-id E1K76YCZI38NN9 \
            --id "$INVALIDATION_ID"
          curl --fail --retry 5 --retry-delay 5 https://www.ppijju.kr/
