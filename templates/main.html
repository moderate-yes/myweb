{% extends "main_head.html"  %}
{% block body %}
<div class="contact-main">
    <div class="character-wrap">
        <div class="character-face">
            <div class="mainline" aria-hidden="true"></div>
            <img src="{{ url_for('static', filename='image/main.png') }}" alt="사이트 캐릭터">
        </div>
    </div>
    <div class="contact-email">
        <h2>janyty@proton.me</h2>
    </div>
</div>

<script>
  (() => {
    const mouth = document.querySelector('.mainline');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!mouth || reducedMotion) return;

    const wait = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

    async function animateMouth() {
      while (mouth.isConnected) {
        // 매 회전 시행마다 시계/반시계 방향을 독립적으로 다시 선택한다.
        const direction = crypto.getRandomValues(new Uint8Array(1))[0] % 2 === 0 ? -1 : 1;
        const spinDuration = 750 + Math.random() * 450;

        await mouth.animate(
          [
            { transform: 'rotate(0deg) scaleX(1)' },
            { transform: `rotate(${direction * 190}deg) scaleX(0.86)`, offset: 0.52 },
            { transform: `rotate(${direction * 360}deg) scaleX(1)` }
          ],
          { duration: spinDuration, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'forwards' }
        ).finished;

        const swayDuration = 1600 + Math.random() * 1000;
        await mouth.animate(
          [
            { transform: 'rotate(0deg)' },
            { transform: `rotate(${direction * 7}deg)` },
            { transform: `rotate(${direction * -5}deg)` },
            { transform: 'rotate(0deg)' }
          ],
          { duration: swayDuration, easing: 'ease-in-out', fill: 'forwards' }
        ).finished;

        await wait(180 + Math.random() * 520);
      }
    }

    animateMouth();
  })();
</script>
{% endblock %}
